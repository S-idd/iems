# Local database/API demo; messaging consumers and email delivery are disabled.
server.address=127.0.0.1
server.port=${IEMS_PORT:8090}
app.name=IEMS database demo
app.version=1.0.0
app.description=IEMS with DCG compatibility governance
app.jwt.secret=${IEMS_JWT_SECRET}
app.jwt.expiration=3600000
app.jwt.refresh-expiration=86400000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.cache.type=simple
spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.consumer.group-id=iems-db-demo
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
spring.rabbitmq.dynamic=false
spring.mail.host=127.0.0.1
app.notification.email.enabled=false
management.health.redis.enabled=false
management.health.rabbit.enabled=false
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health,info
management.tracing.enabled=false
app.messaging.enabled=false
