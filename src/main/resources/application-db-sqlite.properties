spring.datasource.url=${IEMS_JDBC_URL:jdbc:sqlite:./.dcg/data/iems.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=com.iems.persistence.IemsSQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.flyway.locations=classpath:db/portable/sqlite
spring.flyway.baseline-on-migrate=false
